summary: Отримати список контактів
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    schema:
      type: integer
      default: 10
  - name: sortBy
    in: query
    schema:
      type: string
      default: name
  - name: sortOrder
    in: query
    schema:
      type: string
      enum: [asc, desc]
      default: asc
  - name: type
    in: query
    schema:
      type: string
      enum: [work, home, personal]
  - name: isFavourite
    in: query
    schema:
      type: boolean
responses:
  '200':
    description: Список контактів отримано
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/Contact.yaml'
  '400':
    description: Некоректний запит
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
  '404':
    description: Контакти не знайдено
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
