type: object
properties:
  _id:
    type: string
  name:
    type: string
  phoneNumber:
    type: string
  email:
    type: string
  photo:
    type: string
    default: null
  isFavourite:
    type: boolean
  contactType:
    type: string
    enum: [personal, home, work]
  userId:
    type: string
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
