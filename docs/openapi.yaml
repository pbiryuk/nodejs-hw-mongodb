openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: >
    API для керування контактами користувачів з авторизацією, фото та типами контактів.

servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb.onrender.com

tags:
  - name: Contacts
    description: Операції з контактами
  - name: Auth
    description: Реєстрація, логін, рефреш, логаут

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
    ContactInput:
      $ref: '../swagger/components/schemas/ContactInput.yaml'
